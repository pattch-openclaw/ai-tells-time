<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tells Time - Inference Results</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0); 
            color: #ffffff;
            font-family: 'Futura', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 425px;
            height: 1080px;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: 100%;
            box-sizing: border-box;
        }

        /* Title Section */
        .title-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .ai-tells-time {
            font-family: 'Futura', 'Arial', sans-serif;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 14px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* Last Guess Section */
        .last-guess-section {
            background: rgba(15, 15, 20, 0.9);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-header {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #d1d5db;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timestamp {
            font-size: 11px;
            color: #6b7280;
            font-family: monospace;
        }

        /* Reference Time Section */
        .reference-time {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .reference-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }

        .reference-time-display {
            font-size: 42px;
            font-weight: 800;
            font-family: 'Futura', 'Arial', sans-serif;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .reference-sublabel {
            font-size: 14px;
            color: #6b7280;
            font-family: monospace;
            font-weight: 600;
        }

        /* Model Results - Stylized */
        .model-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .model-result:last-child {
            border-bottom: none;
        }

        .model-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            padding-right: 16px;
        }

        .model-name {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Futura', 'Arial', sans-serif;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .model-guess {
            font-size: 36px;
            font-weight: 800;
            font-family: 'Futura', 'Arial', sans-serif;
            letter-spacing: 2px;
        }

        /* Glow classes for accuracy status */
        .glow-accurate {
            color: #4ade80;
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
        }

        .glow-inaccurate {
            color: #ef4444;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .glow-normal {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .model-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            min-width: 120px;
        }

        .status-badge {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-accurate {
            color: #4ade80;
        }

        .status-inaccurate {
            color: #ef4444;
        }

        /* Provider Details Section */
        .provider-details {
            background: rgba(15, 15, 20, 0.9);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .provider-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .provider-item:last-child {
            border-bottom: none;
        }

        .provider-name {
            font-size: 14px;
            font-weight: 700;
            font-family: 'Futura', 'Arial', sans-serif;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .provider-model {
            font-size: 11px;
            color: #9ca3af;
            font-family: monospace;
            text-align: right;
            max-width: 220px;
            word-break: break-all;
        }

        /* Color classes (removed - using consistent white with glow effects) */
    </style>
</head>
<body>
    <div class="container">
        <!-- Title -->
        <div class="title-section">
            <div class="ai-tells-time">AI Tells Time</div>
            <div class="subtitle">Live inference results</div>
        </div>

        <!-- Last Guess Section -->
        <div class="last-guess-section">
            <div class="section-header">
                <span>Last Guess</span>
                <span class="timestamp" id="last-guess-time">--:--:--</span>
            </div>
            
            <div id="model-results">
                <!-- Model results will be populated here -->
            </div>
            
            <!-- Reference Time Section -->
            <div class="reference-time" id="reference-time-section" style="display: none;">
                <span class="reference-label">System Reference Time</span>
                <span class="reference-time-display" id="reference-time-display">--:-- PST</span>
                <span class="reference-sublabel">(PST)</span>
            </div>
        </div>

        <!-- Provider Details Section -->
        <div class="provider-details">
            <div class="section-header">
                <span>Provider Details</span>
            </div>
            
            <div id="provider-details">
                <!-- Provider details will be populated here -->
            </div>
        </div>
    </div>

    <script>
        async function fetchInferenceData() {
            try {
                const response = await fetch(`last-guess.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error('Error fetching inference data:', error);
                // Show placeholder data for testing
                showPlaceholderData();
            }
        }

        function showPlaceholderData() {
            const now = new Date().toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('last-guess-time').innerText = now;
            
            // Get PST time for reference
            const pstNow = new Date().toLocaleTimeString('en-US', { hour12: true, timeZone: 'America/Los_Angeles' });
            
            const placeholderResults = [
                { name: 'CHATGPT', accuracy: 0.75, guess: '12:34' },
                { name: 'CLAUDE', accuracy: 0.62, guess: '1:15' },
                { name: 'GEMINI', accuracy: 0.58, guess: '12:45' },
                { name: 'LOCAL', accuracy: 0.42, guess: '3:15' },
                { name: 'ACTUAL', accuracy: 1.0, guess: pstNow }
            ];

            renderModelResults(placeholderResults, pstNow);

            const placeholderProviders = [
                { name: 'CHATGPT', model: 'gpt-4o-mini' },
                { name: 'CLAUDE', model: 'claude-3-5-haiku' },
                { name: 'GEMINI', model: 'gemini-2.5-flash' },
                { name: 'LOCAL', model: 'qwen2.5vl:7b' }
            ];

            renderProviderDetails(placeholderProviders);
        }

        function getAccuracyStatus(accuracy) {
            // Accurate if within 5 minutes (accuracy >= 91.67%)
            // Inaccurate if an hour or more off (accuracy <= 16.67%)
            // Otherwise normal
            if (accuracy >= 0.9167) {
                return 'accurate';
            } else if (accuracy <= 0.1667) {
                return 'inaccurate';
            }
            return 'normal';
        }

        function renderModelResults(results, actualTime) {
            const container = document.getElementById('model-results');
            container.innerHTML = results.map(result => {
                // Skip ACTUAL provider in the results list (it's shown separately)
                if (result.name === 'ACTUAL') {
                    return '';
                }
                
                const accuracy = result.accuracy;
                const status = getAccuracyStatus(accuracy);
                
                let glowClass;
                let statusText;
                let statusClass;
                
                if (status === 'accurate') {
                    glowClass = 'glow-accurate';
                    statusText = 'Accurate';
                    statusClass = 'status-accurate';
                } else if (status === 'inaccurate') {
                    glowClass = 'glow-inaccurate';
                    statusText = 'Bad Guess';
                    statusClass = 'status-inaccurate';
                } else {
                    glowClass = 'glow-normal';
                    statusText = 'Off by 5-60 min';
                    statusClass = 'status-normal';
                }
                
                return `
                    <div class="model-result">
                        <div class="model-info">
                            <span class="model-name">${result.name}</span>
                            <span class="model-guess ${glowClass}">${result.guess || '--:--'}</span>
                        </div>
                        <div class="model-status">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Show/hide reference time section based on whether ACTUAL is in results
            const referenceSection = document.getElementById('reference-time-section');
            if (actualTime) {
                referenceSection.style.display = 'flex';
                document.getElementById('reference-time-display').innerText = actualTime;
            } else {
                referenceSection.style.display = 'none';
            }
        }

        function renderProviderDetails(providers) {
            const container = document.getElementById('provider-details');
            container.innerHTML = providers.map(provider => {
                return `
                    <div class="provider-item">
                        <span class="provider-name">${provider.name}</span>
                        <span class="provider-model">${provider.model}</span>
                    </div>
                `;
            }).join('');
        }

        function updateDashboard(data) {
            // Update timestamp
            const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('en-US', { hour12: false }) : new Date().toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('last-guess-time').innerText = timestamp;

            // Render model results with ACTUAL time
            const actualTime = data.actual_time || data.reference_time;
            if (data.models && data.models.length > 0) {
                renderModelResults(data.models, actualTime);
            } else {
                renderModelResults([], actualTime);
            }

            // Render provider details
            if (data.providers && data.providers.length > 0) {
                renderProviderDetails(data.providers);
            } else {
                renderProviderDetails([]);
            }
        }

        // Initial fetch
        fetchInferenceData();

        // Poll every 10 seconds for updates
        setInterval(fetchInferenceData, 10000);
    </script>
</body>
</html>
