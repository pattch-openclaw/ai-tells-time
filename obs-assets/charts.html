<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tells Time - Accuracy Charts</title>
    <!-- Use Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0); 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 395px;
            height: 1050px;
            box-sizing: border-box;
        }
        .section {
            background: rgba(15, 15, 20, 0.85);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #f0f0f0;
        }
        .overall-stat {
            font-size: 36px;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
            margin: 10px 0;
        }
        .chart-container {
            position: relative;
            width: 100%;
            min-height: 0;
        }
        .chart-container.full-height {
            height: 600px;
        }
        .chart-container.small-height {
            height: 200px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Accuracy Bar Chart -->
    <div class="section">
        <div class="header">
            <h1>Model Accuracy</h1>
            <div class="overall-stat" id="overall-accuracy">--%</div>
            <div style="font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;">1h vs 24h Accuracy by Model</div>
        </div>
        <div class="chart-container full-height">
            <canvas id="accuracyChart"></canvas>
        </div>
    </div>
    
    <!-- Offset Over Time Line Chart -->
    <div class="section">
        <div class="header">
            <h1>Time Offsets</h1>
            <div style="font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;">Last Hour - Absolute Offset (minutes)</div>
        </div>
        <div class="chart-container small-height">
            <canvas id="offsetChart"></canvas>
        </div>
    </div>
</div>

<script>
    Chart.defaults.color = '#e2e8f0';
    Chart.defaults.font.family = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
    
    let accuracyChart = null;
    let offsetChart = null;

    async function fetchStats() {
        try {
            const response = await fetch(`stats.json?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            updateDashboard(data);
        } catch (error) {
            console.error('Error fetching stats:', error);
        }
    }

    function updateDashboard(data) {
        // Update overall accuracy
        const overallPct = (data.overall.accuracy * 100).toFixed(1);
        document.getElementById('overall-accuracy').innerText = `${overallPct}%`;

        // Prepare accuracy chart data (1h and 24h)
        const models = Object.keys(data.models);
        const labels = models;
        const data1h = models.map(m => data.models[m]['1h'] * 100);
        const data24h = models.map(m => data.models[m]['24h'] * 100);

        if (!accuracyChart) {
            const ctx = document.getElementById('accuracyChart').getContext('2d');
            accuracyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Last 1 Hour',
                            data: data1h,
                            backgroundColor: 'rgba(251, 146, 60, 0.8)', // Orange
                            borderColor: 'rgba(251, 146, 60, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        },
                        {
                            label: 'Last 24 Hours',
                            data: data24h,
                            backgroundColor: 'rgba(56, 189, 248, 0.8)', // Light Blue
                            borderColor: 'rgba(56, 189, 248, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 500 },
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { callback: (v) => v + '%' }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { usePointStyle: true, padding: 20 }
                        }
                    }
                }
            });
        } else {
            accuracyChart.data.datasets[0].data = data1h;
            accuracyChart.data.datasets[1].data = data24h;
            accuracyChart.update('none');
        }

        // Prepare offset line chart data (last hour)
        const offsets = data.offsets || {};
        const offsetModels = Object.keys(offsets);
        
        // Get all timestamps and sort them
        let allTimestamps = new Set();
        offsetModels.forEach(model => {
            offsets[model].forEach(point => allTimestamps.add(point.timestamp));
        });
        const sortedTimestamps = Array.from(allTimestamps).sort();

        if (!offsetChart) {
            const ctx = document.getElementById('offsetChart').getContext('2d');
            offsetChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedTimestamps.map(t => t.slice(11, 19)), // Show HH:MM:SS
                    datasets: offsetModels.map((model, idx) => {
                        const modelOffsets = offsets[model] || [];
                        // Create a map for quick timestamp lookup
                        const offsetMap = {};
                        modelOffsets.forEach(p => offsetMap[p.timestamp] = p.offset_minutes);
                        
                        return {
                            label: model,
                            data: sortedTimestamps.map(t => offsetMap[t] ?? null),
                            borderColor: getChartColor(idx),
                            backgroundColor: getChartColor(idx, 0.2),
                            tension: 0.3,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                            fill: false,
                            spanGaps: true
                        };
                    })
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 300 },
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 6 }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            title: { display: true, text: 'Minutes Offset' }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { usePointStyle: true, padding: 15 }
                        }
                    }
                }
            });
        } else {
            // Update offset chart data
            offsetChart.data.labels = sortedTimestamps.map(t => t.slice(11, 19));
            offsetChart.data.datasets = offsetModels.map((model, idx) => {
                const modelOffsets = offsets[model] || [];
                const offsetMap = {};
                modelOffsets.forEach(p => offsetMap[p.timestamp] = p.offset_minutes);
                return {
                    label: model,
                    data: sortedTimestamps.map(t => offsetMap[t] ?? null),
                    borderColor: getChartColor(idx),
                    backgroundColor: getChartColor(idx, 0.2),
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                    fill: false,
                    spanGaps: true
                };
            });
            offsetChart.update('none');
        }
    }

    function getChartColor(index, alpha = 1) {
        const colors = [
            `rgba(56, 189, 248, ${alpha})`,   // Light Blue - Gemini
            `rgba(251, 146, 60, ${alpha})`,   // Orange - OpenAI
            `rgba(167, 139, 250, ${alpha})`,  // Purple - Claude
            `rgba(244, 63, 94, ${alpha})`,    // Red - Local
            `rgba(52, 211, 153, ${alpha})`,   // Emerald - Other
        ];
        return colors[index % colors.length];
    }

    // Initial fetch
    fetchStats();

    // Poll every 10 seconds for updates
    setInterval(fetchStats, 10000);
</script>

</body>
</html>
